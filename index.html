<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .descargar {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1 id="titulo-principal">Mi portafolio y proyectos</h1>

    <h2 id="descargar1" class="descargar">Descargar aquí</h2>
    <h2 id="descargar2" class="descargar">Descargar aquí</h2>

    <script>
        window.onload = function () {

            document.getElementById("titulo-principal").style.color = "red";

            // mostrar la alerta solo una vez
            let mostrado1 = false;
            let mostrado2 = false;

            document.getElementById("descargar1").addEventListener("mouseenter", () => {
                if (!mostrado1) {
                    alert("Gracias por descargar");
                    mostrado1 = true;
                }
            });

            // Evento para descargar 2
            document.getElementById("descargar2").addEventListener("mouseenter", () => {
                if (!mostrado2) {
                    alert("Gracias por descargar");
                    mostrado2 = true;
                }
            });
        }
    </script>

</body>
</html>
